services:
  sensor-timeline:
    build: .
    image: lab-sensor-timeline:latest
    container_name: lab-sensor-timeline
    ports:
      - "8000:8000"
    environment:
      # SQLite database file inside the container (directory is auto-created).
      SENSOR_DB_PATH: /data/sensors.db
      SENSOR_HOST: 0.0.0.0
      SENSOR_PORT: 8000
    volumes:
      - sensor-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  sensor-data:
